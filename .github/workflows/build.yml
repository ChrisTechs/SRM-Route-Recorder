name: Run Gradle Build
on:
  - push
  - pull_request

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4.1.1

      - name: Setup Java
        uses: actions/setup-java@v4.0.0
        with:
          distribution: temurin
          java-version: 25

      - name: Download and Install Missing JMODs
        run: |
            JAVA_HOME_PATH="${{ env.JAVA_HOME }}"
            
            curl -L "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jmods/hotspot/normal/eclipse?project=jdk" -o jmods.tar.gz
            
            tar -xzf jmods.tar.gz
            mkdir -p "$JAVA_HOME_PATH/jmods"
            mv jdk-25*-jmods/* "$JAVA_HOME_PATH/jmods/"
            
            rm -rf jmods.tar.gz jdk-25*-jmods
            ls -l "$JAVA_HOME_PATH/jmods"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Upload Minified JAR (Production)
        uses: actions/upload-artifact@v4.3.0
        with:
          name: Minestom-Dungeons-Minified
          path: build/libs/*-minified.jar

      - name: Upload Fat JAR (Debug/All)
        uses: actions/upload-artifact@v4.3.0
        with:
          name: Minestom-Dungeons-Full
          path: build/libs/*-all.jar